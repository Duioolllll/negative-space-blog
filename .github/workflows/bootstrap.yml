name: Bootstrap source

# One-time import of the project files (source, images, lockfile) prepared in
# the build session. Does nothing once package.json exists, so it is inert
# after the first run and can be deleted.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the source is already imported
        id: check
        run: |
          if [ -f package.json ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Download and verify archive
        if: steps.check.outputs.needed == 'true'
        run: |
          curl -fsSL "https://d2ol7oe51mr4n9.cloudfront.net/user_3JAqOoZYkjkLyusfqcFNJwD8yZG/627a0953-8833-4c82-8b56-f9070f673e5a.zip" -o /tmp/src.zip
          echo "b966c7729763a023b8d2831a6f7b7afbe814fc4072fd79a7f219f1cdc44444a2  /tmp/src.zip" | sha256sum -c -
      - name: Import files (workflows are managed separately)
        if: steps.check.outputs.needed == 'true'
        run: |
          mkdir -p /tmp/src && unzip -q /tmp/src.zip -d /tmp/src
          rm -rf /tmp/src/.github
          cp -a /tmp/src/. .
          git add -A
          git config user.name "bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git commit -m "Import Negative Space blog source"
          git push
