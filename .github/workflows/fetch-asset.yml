name: Fetch redesign asset

# One-time: adds the generated safelight photo to the liquid-glass branch.
on:
  push:
    branches: [liquid-glass]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and commit
        run: |
          [ -f public/assets/safelight.jpg ] && exit 0
          curl -fsSL "https://d2ol7oe51mr4n9.cloudfront.net/user_3JAqOoZYkjkLyusfqcFNJwD8yZG/eb45fe65-300d-4781-8853-f35cf51c6769.jpg" -o public/assets/safelight.jpg
          echo "3f7836d8d503dc8d1d344e3fd23152d65984759deb2fb2dac21aa2dda115af8b  public/assets/safelight.jpg" | sha256sum -c -
          git add public/assets/safelight.jpg
          git config user.name "asset-fetch"
          git config user.email "asset-fetch@users.noreply.github.com"
          git commit -m "Add safelight photo for the newsletter section"
          git push
