name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Cloudflare setup
        id: setup
        run: |
          if [ ! -f package.json ] || [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || grep -q REPLACE_WITH_YOUR_D1_DATABASE_ID wrangler.jsonc; then
            echo "::warning::Cloudflare is not configured yet (see README: 처음 배포하기). Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.setup.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
      - if: steps.setup.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - if: steps.setup.outputs.ready == 'true'
        run: bun run typecheck
      - if: steps.setup.outputs.ready == 'true'
        run: bun run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - name: Apply database migrations
        if: steps.setup.outputs.ready == 'true'
        run: bunx wrangler d1 migrations apply negative-space-blog --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: steps.setup.outputs.ready == 'true'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
